<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="16" y1="14" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer rounded shield base with shadow -->
  <path d="M32 4 C44 4 54 11 56 22 C56 38 44 52 32 60 C20 52 8 38 8 22 C10 11 20 4 32 4 Z"
        fill="url(#shieldGrad)"
        filter="url(#shadow)"/>

  <!-- Inner shield contour -->
  <path d="M32 8 C41 8 49 14 51 23 C51 36 41 47 32 54 C23 47 13 36 13 23 C15 14 23 8 32 8 Z"
        fill="url(#innerGrad)"/>

  <!-- Medical cross accent (subtle top center) -->
  <rect x="30" y="14" width="4" height="8" rx="1.5" fill="#ffffff" fill-opacity="0.75"/>
  <rect x="28" y="16" width="8" height="4" rx="1.5" fill="#ffffff" fill-opacity="0.75"/>

  <!-- Central verified checkmark -->
  <path d="M22 32 L29 39 L43 23"
        stroke="#ffffff"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>

